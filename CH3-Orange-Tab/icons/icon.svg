<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>CH3-Orange Tab icon</title>
  <!-- Standardized geometry: phi = (1+sqrt(5))/2.
       Orange R = 192.31; grey r = R/phi^2 = 73.46; white r = R/phi^3 = 45.40.
       Grey centres sit on the orange circumference at 0 / 120 / 240 degrees,
       evenly spaced around the full circle. -->
  <circle cx="256" cy="304.08" r="192.31" fill="#FF7300"/>
  <circle cx="256" cy="111.77" r="73.46" fill="#3A3A3A"/>
  <circle cx="422.54" cy="400.23" r="73.46" fill="#3A3A3A"/>
  <circle cx="89.46" cy="400.23" r="73.46" fill="#3A3A3A"/>
  <circle cx="256" cy="304.08" r="45.40" fill="#FFFFFF"/>
</svg>
